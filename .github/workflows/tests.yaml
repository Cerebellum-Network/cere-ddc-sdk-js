name: 'Tests'

on:
  pull_request:
  workflow_dispatch:

  push:
    branches:
      - main

  schedule:
    - cron: "0 6 * * 1-5" #  At 06:00 AM, Monday through Friday

permissions:
  id-token: write
  contents: read

env:
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  tests:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Get Node.js version
        id: nvm
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvm.outputs.NODE_VERSION }}

      - name: Install packages
        run: npm ci

      # Catch a stale lockfile on the PR that introduces it, rather than at the
      # publish step where it surfaces as `lerna ERR! EUNCOMMIT` (run 30500853727).
      # Adding/changing `engines`, deps, or a workspace's version all require the
      # lockfile to be regenerated and committed alongside.
      - name: Verify package-lock.json is up to date
        run: |
          if ! git diff --exit-code --quiet package-lock.json; then
            echo "::error::package-lock.json is out of date — 'npm ci' rewrote it."
            echo "Run 'npm ci' locally in a clean checkout and commit the result."
            git diff --stat package-lock.json
            exit 1
          fi

      - name: Check code style
        run: npm run lint

      - name: Build packages
        run: npm run build

      - name: Check types
        run: npm run check-types:ci

      # Blocking again as of 3.0: the docker-based storage E2E that used to fail here is
      # gone, and the remaining suite runs offline. Specs that need a live chain are
      # skipped unless `CERE_CHAIN_TESTS=1` is set, so this step is deterministic in CI.
      - name: Run tests
        run: npm run test:ci

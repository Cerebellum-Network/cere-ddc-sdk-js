version: '3.4'

# Shared storage-node env, mirrored from the storage team's known-good read/write
# test setup (ddc-node/test/storage/docker-compose.yml). The UNACKNOWLEDGED_DELIVERY_QUOTA_*
# vars are the fix for `RpcError: achieved max limit of unacknowledged delivery` on reads —
# without them the node uses tiny defaults and multipart/large (and even small) piece reads
# exceed the delivery quota. The GRPC bandwidth limiter, GET_SEGMENT_EPSILON_PERCENT=0
# (deterministic reads), PUT timeouts, and CACHE_P2P_DIGEST_TTL are the rest of that setup's
# read/write-path tuning.
x-storage-env: &storage-env
  BLOCKCHAIN_URL: '${BLOCKCHAIN_URL}'
  REDUNDANCY_ERASURE_CODING_REQUIRED: '2'
  REDUNDANCY_ERASURE_CODING_TOTAL: '3'
  REDUNDANCY_ERASURE_CODING_SUCCESS_THRESHOLD: '2'
  REDUNDANCY_ERASURE_CODING_REPAIR_THRESHOLD: '2'
  REDUNDANCY_REPLICATION_TOTAL: '3'
  REDUNDANCY_REPLICATION_SUCCESS_THRESHOLD: '3'
  P2P_MAX_MESSAGE_SIZE: '68157440'
  DATASTORE_MEM_TABLE_SIZE: '536870912'
  DAC_PUBKEY: '0x965981080d26f6a00f27eb6794b14d9022957402ba7e41169f6339516caba16c'
  LOG_LEVEL: 'debug'
  GOMEMLIMIT: '1024MiB'
  # --- read-path / delivery config mirrored from the working storage test setup ---
  UNACKNOWLEDGED_DELIVERY_QUOTA_REFILL_TIMEOUT: '1500s'
  UNACKNOWLEDGED_DELIVERY_QUOTA_MAX_TTL: '3000s'
  UNACKNOWLEDGED_DELIVERY_QUOTA_CAPACITY: '52428800'
  GET_SEGMENT_EPSILON_PERCENT: '0'
  CACHE_P2P_DIGEST_TTL: '5s'
  GRPC_BANDWIDTH_LIMITER_MAX_IDLE: '15s'
  GRPC_BANDWIDTH_LIMITER_MIN_KBPS: '1'
  GRPC_BANDWIDTH_LIMITER_WARMUP: '10s'
  GRPC_BANDWIDTH_LIMITER_EVAL_PERIOD: '5s'
  PUT_METADATA_TIMEOUT: '10s'
  PUT_SEGMENT_TIMEOUT: '30s'
  PUT_MERKLE_TREE_TIMEOUT: '10s'

services:
  ddc-storage-node-1:
    platform: linux/amd64
    container_name: ddc-storage-node-1
    image: cerebellumnetwork/ddc-storage-node:v0.1.19
    environment:
      <<: *storage-env
      NODE_ID: '1'
      MODE: 'storage'
      HTTP_PORT: '8091'
      GRPC_PORT: '9091'
      P2P_PORT: '9071'
      PEER_SECRET_PHRASE: 'whip clump surface eternal summer acoustic broom duty magic extend virtual fly'
    ports:
      - '8091:8091'
      - '9071:9071'
      - '9091:9091'

  ddc-storage-node-2:
    platform: linux/amd64
    container_name: ddc-storage-node-2
    image: cerebellumnetwork/ddc-storage-node:v0.1.19
    environment:
